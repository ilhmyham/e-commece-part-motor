services:
  db:
    image: postgres:17-alpine
    container_name: toko-part-motor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: toko_part_motor
    ports:
      # Kalau port 5432 sudah dipakai Postgres lain di komputermu, ganti jadi "5433:5432"
      # dan sesuaikan DATABASE_URL di .env
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d toko_part_motor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: